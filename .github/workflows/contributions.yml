name: Update 2026 contributions
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/contributions.yml
      - scripts/contributions.py
  schedule:
    - cron: '27 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-contributions
  cancel-in-progress: false
jobs:
  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Read GitHub contributions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/contributions.py
      - name: Save changed calendar
        run: |
          git add assets/contributions-2026.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update 2026 contribution calendar'
          git push
